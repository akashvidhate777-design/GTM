# Local-server hosting for the outreach system:
#   docker compose up -d
#   n8n UI      -> http://localhost:5678  (import the 3 workflows from n8n/)
#   agent runs  -> docker compose run --rm outreach-agent \
#                    python -m outreach_agent.cli run --input data/leads.csv
services:
  n8n:
    image: n8nio/n8n:latest
    container_name: n8n
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=${N8N_BASIC_AUTH_USER:-admin}
      - N8N_BASIC_AUTH_PASSWORD=${N8N_BASIC_AUTH_PASSWORD}
      - GENERIC_TIMEZONE=${GENERIC_TIMEZONE:-Asia/Kolkata}
      - TZ=${GENERIC_TIMEZONE:-Asia/Kolkata}
      - WEBHOOK_URL=${WEBHOOK_URL:-http://localhost:5678/}
      # env forwarded into workflow expressions ($env.*)
      - GOOGLE_SHEET_ID=${GOOGLE_SHEET_ID}
      - SLACK_APPROVALS_CHANNEL=${SLACK_APPROVALS_CHANNEL:-#outreach-approvals}
      - SLACK_REPORTS_CHANNEL=${SLACK_REPORTS_CHANNEL:-#outreach-reports}
      - SENDER_NAME=${SENDER_NAME}
      - SENDER_EMAIL=${SENDER_EMAIL}
      - CALENDLY_URL=${CALENDLY_URL}
      - DAILY_SEND_CAP=${DAILY_SEND_CAP:-30}
    volumes:
      - n8n_data:/home/node/.n8n

  outreach-agent:
    build: .
    container_name: outreach-agent
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - GOOGLE_SHEET_ID=${GOOGLE_SHEET_ID}
      - GOOGLE_SERVICE_ACCOUNT_JSON=/secrets/service-account.json
      - SLACK_BOT_TOKEN=${SLACK_BOT_TOKEN}
      - SLACK_REPORTS_CHANNEL=${SLACK_REPORTS_CHANNEL:-#outreach-reports}
    volumes:
      - ./data:/app/data
      - ./output:/app/output
      - ${GOOGLE_SERVICE_ACCOUNT_JSON:-./secrets/service-account.json}:/secrets/service-account.json:ro
    # idle by default; n8n or you invoke runs on demand
    command: ["sleep", "infinity"]

volumes:
  n8n_data:
